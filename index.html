.btn-browse:hover { background:rgba(79,142,247,0.2); }

.options-bar {

}
.opt-group { display:flex; flex-direction:column; gap:4px; }
.opt-label { font-size:10px; font-weight:600; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.opt-row { display:flex; align-items:center; gap:8px; }
.toggle-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; }
.toggle { width:36px; height:20px; background:var(--border); border-radius:10px; position:relative; transition:background 0.2s; cursor:pointer; }
.toggle.on { background:var(--accent); }
.toggle::after { content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; background:#fff; border-radius:50%; transition:transform 0.2s; }
.toggle.on::after { transform:translateX(16px); }
.toggle-label { font-size:12px; color:var(--muted); }
.color-pick-wrap { display:flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }

.color-pick-wrap.active { opacity:1; pointer-events:all; }
.color-pick-wrap input[type="color"] { width:24px; height:24px; border:none; border-radius:4px; padding:0; cursor:pointer; background:none; }
.color-pick-wrap span { font-size:12px; color:var(--muted); }
.btn-remove-bg-opt { background:none; border:1px solid rgba(79,142,247,0.3); color:var(--accent); padding:4px 12px; border-radius:6px; font-size:11px; cursor:pointer; transition:background 0.2s; }
.btn-remove-bg-opt:hover { background:rgba(79,142,247,0.1); }

.workspace { display:none; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
