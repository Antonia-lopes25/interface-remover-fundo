<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor de Fundo - Logo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }

        .upload-section:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: #4CAF50;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .upload-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .preview-section {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .image-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .image-card h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-container {
            background: repeating-conic-gradient(#2a2a2a 0% 25%, #1a1a1a 0% 50%) 50% / 20px 20px;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .download-btn {
            background: #2196F3;
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            display: none;
            transition: all 0.3s;
            border: none;
            font-weight: 600;
        }

        .download-btn:hover {
            background: #0b7dda;
            transform: translateY(-2px);
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #ffcdd2;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #c8e6c9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .preview-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Removedor de Fundo para Logos</h1>

        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <p style="margin-bottom: 20px; font-size: 1.1rem;">Clique para fazer upload da imagem</p>
            <label class="upload-btn" for="fileInput">📁 Escolher Imagem</label>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processando imagem... Aguarde...</p>
            <p style="font-size: 0.9rem; opacity: 0.8;">(O primeiro request pode levar alguns minutos)</p>
        </div>

        <div class="error" id="error"></div>
        <div class="success" id="success">✓ Fundo removido com sucesso!</div>

        <div class="preview-section" id="previewSection">
            <div class="image-card">
                <h3>📷 Original</h3>
                <div class="image-container">
                    <img id="originalImage" alt="Original">
                </div>
            </div>

            <div class="image-card">
                <h3>✨ Sem Fundo</h3>
                <div class="image-container">
                    <img id="resultImage" alt="Resultado">
                </div>
                <button class="download-btn" id="downloadBtn" onclick="downloadImage()">
                    ⬇️ Baixar Imagem
                </button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ SUBSTITUA PELA URL DO SEU SPACE
        const API_URL = 'https://seu-username-seu-space.hf.space';
        
        let resultBase64 = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Mostrar preview original
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('originalImage').src = e.target.result;
                document.getElementById('previewSection').style.display = 'grid';
                
                // Processar imagem
                processImage(file);
            };
            reader.readAsDataURL(file);
        }

        async function processImage(file) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            const downloadBtn = document.getElementById('downloadBtn');

            // Resetar estados
            loading.style.display = 'block';
            error.style.display = 'none';
            success.style.display = 'none';
            downloadBtn.style.display = 'none';

            try {
                // Converter para base64
                const base64 = await fileToBase64(file);
                
                // Remover prefixo data:image/...;base64, se existir
                const cleanBase64 = base64.split(',')[1] || base64;

                // Chamar API
                const response = await fetch(`${API_URL}/remove`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: cleanBase64,
                        useDisEdgeRefiner: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.status}`);
                }

                const data = await response.json();

                // ✅ IMPORTANTE: Adicionar prefixo data:image/png;base64,
                resultBase64 = `data:image/png;base64,${data.image}`;
                
                document.getElementById('resultImage').src = resultBase64;
                
                loading.style.display = 'none';
                success.style.display = 'block';
                downloadBtn.style.display = 'inline-block';

                console.log(`Tempo de processamento: ${data.processing_time_ms}ms`);
                console.log(`Dispositivo: ${data.device}`);

            } catch (err) {
                console.error('Erro:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `❌ Erro: ${err.message}. Verifique se a API está online.`;
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function downloadImage() {
            if (!resultBase64) return;

            const link = document.createElement('a');
            link.download = 'logo-sem-fundo.png';
            link.href = resultBase64;
            link.click();
        }

        // Verificar se API está online
        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                console.log('API Status:', data);
            } catch (err) {
                console.error('API offline ou URL incorreta:', err);
                alert('⚠️ Verifique se a URL da API está correta e se o Space está online!');
            }
        }

        // Verificar health ao carregar
        checkHealth();
    </script>
</body>
</html>
